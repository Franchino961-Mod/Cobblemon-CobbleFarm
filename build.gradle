plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
}

version = project.mod_version
archivesBaseName = "${project.archives_base_name}-fabric-mc${project.minecraft_version}"
group = project.maven_group

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.impactdev.net/repository/development/" }
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://maven.architectury.dev/" }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    runConfigs.all {
        property "fabric.remapper.reflection", "true"
        property "fabric.remapper.reflection.local", "true"
        property "fabric.remapper.reflection.packages", "com.cobblemon.mod,net.minecraft"
    }

    mods {
        "cobblefarm" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:1.21.1+build.3:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // modRuntimeOnly "maven.modrinth:sodium:mc1.21.1-0.6.13-fabric"
    // modRuntimeOnly "maven.modrinth:lithium:mc1.21.1-0.15.3"
    // modRuntimeOnly "maven.modrinth:sodium-extra:mc1.21.1-0.6.0-fabric"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
    modImplementation "dev.architectury:architectury-fabric:${project.architectury_version}"

    // Cobblemon
    modImplementation "maven.modrinth:cobblemon:${project.cobblemon_version}-fabric"
    modRuntimeOnly "org.jetbrains.kotlin:kotlin-reflect:2.0.20"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Helper function to extract only the latest version's changelog from Docs/CHANGELOG.en.md
def getLatestChangelog() {
    def changelogFile = file('Docs/CHANGELOG.en.md')
    if (!changelogFile.exists()) return "No changelog found."
    def lines = changelogFile.readLines()
    def content = []
    def recording = false
    for (line in lines) {
        if (line.startsWith("## [")) {
            if (line.toLowerCase().contains("unreleased")) {
                continue // Skip Unreleased section
            }
            if (recording) {
                break // Found previous version, stop
            }
            recording = true
            content.add(line)
            continue
        }
        if (recording) {
            if (line.trim() == "---") {
                break
            }
            content.add(line)
        }
    }
    return content.join("\n").trim()
}

publishMods {
    file = tasks.named('remapJar').flatMap { it.archiveFile }
    changelog = getLatestChangelog()
    type = STABLE
    
    def curseToken = providers.environmentVariable("CURSEFORGE_TOKEN").orNull
    if (curseToken && !curseToken.trim().isEmpty() && project.findProperty("curseforge_project_id")) {
        curseforge {
            accessToken = curseToken
            projectId = project.findProperty("curseforge_project_id")
            minecraftVersions.add(project.minecraft_version)
            modLoaders.add("fabric")
            javaVersions.add(JavaVersion.VERSION_21)
            displayName = "${project.mod_name} - ${project.mod_version}"
            changelogType = "markdown"
            
            clientRequired = true
            serverRequired = true
        }
    }
}

